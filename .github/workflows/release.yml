name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: linux
            ext: deb
          - os: windows-latest
            profile: windows
            ext: exe
          - os: macos-latest
            profile: macos
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '25'
          cache: maven

      # jpackage needs fakeroot to assemble the .deb and rpm (rpmbuild) to assemble the .rpm
      - name: Install fakeroot and rpm
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      # jpackage needs the WiX Toolset to produce the .exe
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Build installer
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean install -P ${{ matrix.profile }} -DskipTests

      # jpackage names files per platform (e.g. "Dinosaur Edward Game-3.0.0.exe",
      # "dinosaur-edward-game_3.0.0_amd64.deb"); normalize to the README convention.
      - name: Stage installer with the release file name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          mkdir -p dist
          shopt -s nullglob
          for file in target/output/*.${{ matrix.ext }}; do
            cp "$file" "dist/dinosaur-edward-game-${version}.${{ matrix.ext }}"
          done

      # The linux profile also builds the .rpm and an app-image (game + embedded Java) used by the Arch package
      - name: Stage Linux rpm and app-image tarball
        if: runner.os == 'Linux'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          shopt -s nullglob
          for file in target/output/*.rpm; do
            cp "$file" "dist/dinosaur-edward-game-${version}.rpm"
          done
          tar -C target/app-image -czf "dist/dinosaur-edward-game-${version}-linux-x64.tar.gz" dinosaur-edward-game

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: dinosaur-${{ matrix.profile }}
          path: dist/*
          if-no-files-found: error

  # Arch Linux package built from the app-image tarball; nothing goes to the AUR
  arch-package:
    needs: package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux app-image tarball
        uses: actions/download-artifact@v7
        with:
          name: dinosaur-linux
          path: packaging/arch

      - name: Build package
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          cd packaging/arch
          cp ../linux/dinosaur-edward-game.desktop ../linux/dinosaur-edward-game.png ../../LICENSE ../../THIRD_PARTY_NOTICES.md .
          sed -i "s/^pkgver=.*/pkgver=${version}/" PKGBUILD
          # makepkg refuses to run as root; -d skips installing the runtime deps just to package
          useradd -m builder
          chown -R builder: .
          su builder -c "makepkg -f -d --noconfirm"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp dinosaur-edward-game-*.pkg.tar.zst "$GITHUB_WORKSPACE/dist/dinosaur-edward-game-${version}-x86_64.pkg.tar.zst"

      - name: Upload Arch package
        uses: actions/upload-artifact@v6
        with:
          name: dinosaur-arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [package, arch-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create release and attach installers
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
